<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Core integration acceptance fixture</title><style>body{margin:0;background:#f9f8f5}main{min-width:0}</style><div id="nav"></div><main id="people"></main><script type="module">
import {mountCoreNavigation} from '/integrations/cowboys-core/navigation.mjs';
import {mountPeopleResearch} from '/integrations/cowboys-core/people-research.mjs';
const tables={cowboys_core_people_cases:[],cowboys_core_people_runs:[],cowboys_core_people_findings:[]};
let seq=0,starts=0;
const id=()=>String(++seq).padStart(8,'0')+'-0000-4000-8000-000000000000';
const client={
 from(table){
  let operation='select',payload=null,filters=[],single=false;
  const builder={
    select(){return builder},order(){return builder},limit(){return builder},
    eq(key,value){filters.push([key,value]);return builder},
    insert(value){operation='insert';payload=value;return builder},
    update(value){operation='update';payload=value;return builder},
    delete(){operation='delete';return builder},
    single(){single=true;return builder},
    then(resolve,reject){
      try{
        let rows=tables[table].filter(row=>filters.every(([key,value])=>row[key]===value));
        if(operation==='insert'){const row={id:id(),created_at:new Date().toISOString(),...payload};tables[table].unshift(row);rows=[row];}
        if(operation==='update')for(const row of rows)Object.assign(row,payload);
        if(operation==='delete'){tables[table]=tables[table].filter(row=>!rows.includes(row));rows=[];}
        return Promise.resolve({data:single?rows[0]:rows,error:null}).then(resolve,reject);
      }catch(error){return Promise.reject(error).then(resolve,reject);}
    }
  };return builder;
 },
 functions:{async invoke(_,{body}){
  if(body.action==='status')return {data:{enabled:true}};
  if(body.action==='start'){
   starts++;
   const run={id:id(),case_id:body.case_id,status:'running',created_at:new Date().toISOString()};
   tables.cowboys_core_people_runs.unshift(run);
   return {data:{run}};
  }
  const run=tables.cowboys_core_people_runs.find(r=>r.id===body.run_id);
  run.status=body.action==='cancel'?'cancelled':'finished';run.finished_at=new Date().toISOString();
  if(run.status==='finished'&&!tables.cowboys_core_people_findings.length)tables.cowboys_core_people_findings.push({
    id:id(),run_id:run.id,event_type:'ACCOUNT_EXTERNAL_OWNED',source_name:'Synthetic source',
    source_url:'https://gitlab.com/corefixture',observed_at:new Date().toISOString(),association:'unverified',review_state:'unreviewed'});
  return {data:{run}};
 }}
};
const people=await mountPeopleResearch({host:document.querySelector('#people'),client,confirmDelete:()=>true});
const sections=[{id:'home',label:'Overview',color:'amber'},{id:'library',label:'Library',color:'blue'},
 {id:'work',label:'Work',color:'orange'},{id:'people',label:'People',color:'violet'},
 {id:'tools',label:'Toolbox',color:'teal'},{id:'savage',label:'Savage Pest Warfare',group:'Workspaces',color:'orange'},
 {id:'pvf',label:'PVF',group:'Workspaces',color:'teal'},{id:'business',label:'Call & Haul',group:'Workspaces',color:'rose'}];
const nav=mountCoreNavigation({host:document.querySelector('#nav'),sections,activeId:'people',
 onNavigate:id=>{window.lastRoute=id},actions:[{label:'New research case',run:()=>people.newCase()},
 {label:'New note',run:()=>{window.lastAction='new-note'}},{label:'Quick receipt',run:()=>{window.lastAction='receipt'}}]});
window.coreFixture={tables,get starts(){return starts},people,nav,ready:true};
</script></html>
