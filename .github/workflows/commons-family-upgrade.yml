          node --check docs/community.js
          node --check docs/commons-family.mjs
          node --check docs/commons-drawing.mjs
          git diff --check
      - name: Commit changed board resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community.html docs/commons-family.css docs/commons-family.mjs docs/commons-drawing.mjs
          git diff --cached --quiet || (git commit -m "Add Commons family Word Quest, art studio, and readable replies" && git push origin HEAD:main)
