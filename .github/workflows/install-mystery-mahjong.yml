          assets=json.loads(zlib.decompress(payload).decode('utf-8'))
          for name,source in assets.items():
              f=Path(name)
              if not f.parent.is_dir():
                  raise SystemExit('Expected docs folder missing')
              if not f.exists() or f.read_text(encoding='utf-8')!=source:
                  f.write_text(source,encoding='utf-8')
          
          html_file=Path('docs/community.html')
          profile_file=Path('docs/community-profiles.mjs')
          app_file=Path('docs/community.js')
          for p in (html_file,profile_file,app_file):
              if not p.is_file():
                  raise SystemExit(f'Expected Commons file missing: {p}')
          
          html=html_file.read_text(encoding='utf-8')
          anchor='<link rel="stylesheet" href="commons-plates.css?v=1"><script type="module" src="commons-plates.mjs?v=1"></script>'
          insert='\n<link rel="stylesheet" href="commons-mahjong.css?v=1"><script type="module" src="commons-mahjong.mjs?v=1"></script>'
          if 'commons-mahjong.mjs?v=1' not in html:
              if html.count(anchor)!=1:
                  raise SystemExit('License plate game stylesheet anchor is missing; no unsafe modifications')
              html=html.replace(anchor,anchor+insert,1)
          old='community.js?v=hero4'
          new='community.js?v=mahjong1'
          if new not in html:
              if html.count(old)!=1:
                  raise SystemExit('Unexpected community.js version; cannot safely refresh cache')
              html=html.replace(old,new,1)
          html_file.write_text(html,encoding='utf-8')
          
          app=app_file.read_text(encoding='utf-8')
          old="./community-profiles.mjs?v=private1"
          new="./community-profiles.mjs?v=mahjong1"
          if new not in app:
              if app.count(old)!=1:
                  raise SystemExit('Profile import changed. No unsafe replacement.')
              app=app.replace(old,new,1)
              app_file.write_text(app,encoding='utf-8')
          
          profiles=profile_file.read_text(encoding='utf-8')
          old='await ctx.onMemberShown?.(id);}'
          new="await ctx.onMemberShown?.(id);void import('./commons-mahjong-profile.mjs?v=1').then(m=>m.showAchievements(ctx,id)).catch(()=>{});}"
          if new not in profiles:
              if profiles.count(old)!=1:
                  raise SystemExit('Profile reader callback changed; no modification made.')
              profiles=profiles.replace(old,new,1)
          
          old="profileDraft=attachDraft(document.getElementById('profile-studio-form'),draftKey(ctx.state.member.user_id,'profile'),{preview:ctx.isPreview,onRestore:refresh});refresh();}"
          new="profileDraft=attachDraft(document.getElementById('profile-studio-form'),draftKey(ctx.state.member.user_id,'profile'),{preview:ctx.isPreview,onRestore:refresh});refresh();void import('./commons-mahjong-profile.mjs?v=1').then(m=>m.showAchievements(ctx,ctx.state.member.user_id)).catch(()=>{});}"
          if new not in profiles:
              if profiles.count(old)!=1:
                  raise SystemExit('Own profile editor hook changed; no modification made.')
              profiles=profiles.replace(old,new,1)
          profile_file.write_text(profiles,encoding='utf-8')
          print('Mahjong UI, scores, player profile achievements, and cache versions installed.')
