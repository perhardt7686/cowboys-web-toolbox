name: Activate Coco Board
on:
  push:
    paths:
      - .github/workflows/coco-board-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check docs/community-coco.mjs
      - run: echo  | base64 -d | python3
      - run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/community.html
          git diff --cached --quiet || (git commit -m coco_board_only && git push)
