name: Fix Commons intro cards and text contrast
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commons-intro-contrast-fix-v2.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove shortcut cards and improve contrast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('docs/community-readable.css')
          page = Path('docs/community.html')
          lab = Path('docs/community-lab.mjs')
          if not (css.is_file() and page.is_file() and lab.is_file()):
              raise SystemExit('Expected Commons files missing: no changes made.')
          if 'lab-quick-actions' not in lab.read_text(encoding='utf-8'):
              raise SystemExit('Original shortcut cards not found: no changes made.')
          html = page.read_text(encoding='utf-8')
          old = 'community-readable.css?v=readability1'
          new = 'community-readable.css?v=readability3'
          if html.count(old) != 1 and html.count(new) != 1:
              raise SystemExit('Expected stylesheet link not found: no changes made.')
          marker = '/* Commons simplified hero and contrast v3 */'
          patch = '''
          /* Commons simplified hero and contrast v3 */
          body.community-page #lab-intro.lab-intro{display:block!important;grid-template-columns:none!important;padding-top:20px;padding-bottom:28px;margin-bottom:30px;border-bottom:2px dashed #ceaa89}
          body.community-page #lab-intro .lab-quick-actions{display:none!important}
          body.community-page #lab-intro .lab-intro-copy{width:100%;max-width:800px;min-width:0}
          body.community-page #lab-intro .lab-intro-copy h2{color:#41254f!important;font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(34px,5.8vw,54px)!important;font-weight:700!important;letter-spacing:-.025em;line-height:1.13;text-shadow:none!important}
          body.community-page #lab-intro .lab-intro-copy h2 em{color:#0c5967!important;font-weight:600!important;text-shadow:none!important}
          body.community-page #lab-intro .lab-intro-copy>p:last-child{color:#48364b!important;max-width:760px;font-size:clamp(16px,2vw,19px)!important;font-weight:600!important;line-height:1.6}
          body.community-page #lab-intro .lab-intro-copy>.eyebrow{color:#653476!important;font-size:clamp(11px,1.7vw,14px)!important;font-weight:900!important;line-height:1.5}
          @media(max-width:650px){body.community-page #lab-intro.lab-intro{padding-top:10px;padding-bottom:25px;margin-bottom:27px}body.community-page #lab-intro .lab-intro-copy h2{font-size:clamp(34px,8.2vw,43px)!important}body.community-page #lab-intro .lab-intro-copy>p:last-child{font-size:16px!important}}
          '''
          current = css.read_text(encoding='utf-8')
          if marker not in current:
              css.write_text(current.rstrip() + '\n' + patch, encoding='utf-8')
          if old in html:
              page.write_text(html.replace(old, new, 1), encoding='utf-8')
          print('Commons intro fix installed and cache key refreshed.')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/community-readable.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Commons shortcut cards and improve hero readability'
            git push origin HEAD:main
          fi
