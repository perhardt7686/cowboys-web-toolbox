name: Publish real Toolbox website previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-site-previews.py'
      - '.github/workflows/capture-site-previews.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 10 1 * *'
permissions:
  contents: write
concurrency:
  group: toolbox-public-preview-capture
  cancel-in-progress: false
jobs:
  public-screenshots:
    if: github.repository == 'perhardt7686/cowboys-web-toolbox'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out public Toolbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install headless browser and image encoder
        run: |
          python -m pip install 'playwright>=1.50,<2' 'Pillow>=10,<13'
          python -m playwright install --with-deps chromium firefox
      - name: Capture public homepages without logins
        timeout-minutes: 75
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/capture-site-previews.py --workers 4 --browser chromium
          # Sites blocked in Chromium may still offer a public Firefox view.
          # Existing valid screenshots are automatically skipped.
          python scripts/capture-site-previews.py --workers 4 --browser firefox
      - name: Verify images are unique successful site captures
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=Path('docs/site-shots/manifest.js').read_text()
          x=re.search(r'Object\.freeze\((\{.*\})\);',m)
          assert x,'Missing generated manifest'
          data=json.loads(x.group(1))
          assert all((Path('docs/site-shots')/(k+'.webp')).is_file() for k in data)
          assert all(v['captured'] for v in data.values())
          print('Verified',len(data),'site-specific screenshot assets.')
          PY
      - name: Rebuild the homepage and downloadable preview
        run: python3 build.py
      - name: Commit only generated screenshot images and manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-shots/ docs/index.html docs/Cowboys-Web-Toolbox-Preview.html
          if git diff --cached --quiet; then
            echo 'No new public screenshot captures.'
            exit 0
          fi
          git commit -m "Publish verified public website preview screenshots"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
