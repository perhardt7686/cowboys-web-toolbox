name: Commons mobile readability browser check
on:
  push:
    branches: [main]
    paths:
      - 'docs/commons-feed-legibility.css'
      - 'docs/family-*'
      - 'tests/browser-family-board.py'
      - 'docs/unified-nav.css'
      - 'docs/unified-nav.js'
      - 'tests/browser-shared-navigation.py'
      - 'tests/browser-commons-contrast.py'
      - 'tests/browser-streetrod-ega.py'
      - 'tests/browser-arcade-shell.py'
      - 'docs/commons-arcade-shell.mjs'
      - 'docs/commons-streetrod-scene-flow.mjs'
      - 'docs/commons-streetrod-scene-flow.css'
      - 'docs/commons-streetrod-ega.mjs'
      - 'tests/browser-streetrod-scenes.py'
      - 'tests/browser-streetrod-reborn.py'
      - 'docs/streetrod-reborn.mjs'
      - 'docs/streetrod-reborn.css'
      - 'docs/streetrod-reborn-config.js'
      - 'docs/streetrod-race-physics.mjs'
      - 'docs/commons-streetrod-summer.mjs'
      - 'docs/commons-streetrod-season-bay.mjs'
      - 'docs/commons-streetrod-gas.mjs'
      - 'tests/streetrod-race-physics.test.mjs'
      - 'supabase/migrations/20261114131126_streetrod_race_authentic_shift_and_launch_timing.sql'
      - 'docs/commons-arcade-shell.css'
      - 'docs/commons-compact-ui.css'
      - 'docs/commons-board-compact.mjs'
      - 'docs/commons-plates.mjs'
      - 'docs/commons-mahjong.mjs'
      - 'docs/community-coco.mjs'
      - 'docs/commons-streetrod-ega.mjs'
      - 'docs/commons-streetrod-ega.css'
      - '.github/workflows/commons-ui-smoke.yml'
  pull_request:
    paths:
      - 'docs/family-*'
      - 'docs/commons-arcade-shell.mjs'
      - 'docs/unified-nav.*'
      - 'tests/browser-*.py'
      - '.github/workflows/commons-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-forum:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium webkit
      - name: Inspect real computed CSS on a local sample member feed
        run: |
          python -m http.server 8765 --directory docs >/tmp/commons-smoke-http.log 2>&1 &
          python tests/browser-commons-contrast.py
          python tests/browser-shared-navigation.py
          python tests/browser-family-board.py
          python tests/browser-streetrod-ega.py
          python tests/browser-arcade-shell.py
          python tests/browser-streetrod-scenes.py
          python tests/browser-streetrod-reborn.py
      - name: Retain test-only iPhone-sized screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commons-contrast-mobile-demo
          path: |
            reports/commons-mobile-legibility.png
            reports/shared-nav-toolbox-mobile.png
            reports/shared-nav-commons-mobile.png
            reports/streetrod-ega-iphone-sample.png
            reports/arcade-one-screen-iphone-sample.png
            reports/streetrod-room-garage-mobile.png
            reports/streetrod-reborn-iphone.png
          if-no-files-found: ignore
          retention-days: 7
