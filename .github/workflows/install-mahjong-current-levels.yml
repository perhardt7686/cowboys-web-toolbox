name: Install Mahjong Current Player Levels
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/install-mahjong-current-levels.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Add current levels for every Commons member
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, zlib
          source=zlib.decompress(base64.b64decode(''))
          exec(compile(source,'mahjong_player_levels_patch.py','exec'))
          PYCODE
          node --check docs/commons-mahjong.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/commons-mahjong.mjs docs/commons-mahjong.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m 'Show every Commons player current Mahjong level'
            git push origin HEAD:main
          fi
