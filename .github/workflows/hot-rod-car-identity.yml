name: Hot Rod 1963 Car Identity & Mobile Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'docs/hot-rod-catalog.mjs'
      - 'docs/hot-rod-racing.mjs'
      - 'docs/hot-rod-campaign.mjs'
      - 'docs/hot-rod-input.mjs'
      - 'tests/hot-rod-player-report.test.mjs'
      - 'docs/hot-rod-vehicle-art.mjs'
      - 'docs/hot-rod-art.mjs'
      - 'docs/hot-rod-game.mjs'
      - 'docs/hot-rod-board.mjs'
      - 'tests/hot-rod-vehicle-fidelity.test.mjs'
      - 'tests/browser-hot-rod.py'
      - '.github/workflows/hot-rod-car-identity.yml'
  pull_request:
    paths:
      - 'docs/hot-rod-catalog.mjs'
      - 'docs/hot-rod-racing.mjs'
      - 'docs/hot-rod-campaign.mjs'
      - 'docs/hot-rod-input.mjs'
      - 'tests/hot-rod-player-report.test.mjs'
      - 'docs/hot-rod-vehicle-art.mjs'
      - 'docs/hot-rod-art.mjs'
      - 'docs/hot-rod-game.mjs'
      - 'docs/hot-rod-board.mjs'
      - 'tests/hot-rod-vehicle-fidelity.test.mjs'
      - 'tests/browser-hot-rod.py'
      - '.github/workflows/hot-rod-car-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  era-catalogue-and-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify 40 period cars, 25 legacy save IDs, each EGA sprite and workshop cosmetic states
        run: |
          node --check docs/hot-rod-vehicle-art.mjs
          node --check docs/hot-rod-catalog.mjs
          node --check docs/hot-rod-game.mjs
          node --test tests/hot-rod-vehicle-fidelity.test.mjs tests/hot-rod-player-report.test.mjs tests/hot-rod-drivetrain.test.mjs
  forty-vehicle-gallery-and-play:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install 'playwright==1.64.1'
      - name: Verify all 40 rendered cars, original garage workflow, portrait and landscape in Chromium and WebKit
        run: |
          python -m http.server 8765 --directory docs >/tmp/hot-rod-1963-preview.log 2>&1 &
          python tests/browser-hot-rod.py
      - name: Retain inspectable 40-car side-by-side gallery and screen captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hot-rod-40-car-period-fidelity-gallery
          path: |
            reports/hot-rod-*-all-40-cars.png
            reports/hot-rod-*-garage.png
            reports/hot-rod-*-inventory.png
            reports/hot-rod-*-drive-in.png
            reports/hot-rod-*-cockpit.png
          if-no-files-found: ignore
          retention-days: 14
