name: Mystery Crew 48-outfit painted Wave inventory
on:
  pull_request:
    paths:
      - 'scripts/audit_mystery_crew_wave_coverage.py'
      - '.github/workflows/mystery-crew-wave-coverage.yml'
      - 'docs/mystery-crew-v5-illustrated.tar'
      - 'docs/mystery-crew-v9-scout/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-coverage:
    name: verify-48-originals-report-art-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-art inspector
        run: python -m pip install 'pillow>=11,<13'
      - name: Audit all original characters and laboratory coverage
        run: python scripts/audit_mystery_crew_wave_coverage.py
      - name: Enforce truthful preview-only status and full 48-count
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          r=json.loads(Path('reports/mystery-crew-wave-coverage.json').read_text())
          assert r['source_outfits']==48
          assert r['lab_wave_outfits']==1
          assert r['art_approved_outfits']==0
          assert r['remaining_without_authored_wave']==47
          assert r['public_release_ready'] is False
          assert len(r['items'])==48
          assert sum(x['wave_status']=='lab_only' for x in r['items'])==1
          assert all(not x['art_approved'] for x in r['items'])
          assert r['rejected_studies'][0]['key']=='crew-1-explorer'
          with Image.open('reports/mystery-crew-wave-source-48.png') as im:
              assert im.size==(1640,1692)
          print('VERIFIED: 48 unchanged originals, 1 experiment, 0 approved; published V5 unaffected')
          PY
      - name: Upload 48-art image board and per-outfit inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystery-crew-48-wave-source-inventory
          path: |
            reports/mystery-crew-wave-source-48.png
            reports/mystery-crew-wave-coverage.json
          retention-days: 10
