name: Build Mystery Crew V5 illustrated characters
on:
  push:
    branches:
      - feature/mystery-crew-v5-character-outfit-anchors-20261119
    paths:
      - 'docs/mystery-crew-v5-atlas.png'
      - 'scripts/build_mystery_crew_v5.py'
      - '.github/workflows/mystery-crew-v5-assets.yml'
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install minimal deterministic art pipeline
        run: python -m pip install 'pillow>=11,<13' 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5'
      - name: Render all 48 painted front-view costumes
        run: python scripts/build_mystery_crew_v5.py
      - name: Inspect compressed image pack
        run: |
          python - <<'PY'
          import io,tarfile
          from pathlib import Path
          from PIL import Image
          p=Path('docs/mystery-crew-v5-illustrated.tar')
          with tarfile.open(p) as f:
              names=f.getnames()
              assert len(names)==len(set(names))==48
              assert p.stat().st_size<4500000
              for item in f:
                  im=Image.open(io.BytesIO(f.extractfile(item).read()))
                  im.load()
                  assert im.size==(430,574),item.name
          print('Verified 48 front-view painted outfits:',p.stat().st_size,'bytes')
          PY
      - name: Commit production-ready binary to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mystery-crew-v5-illustrated.tar
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Add all 48 illustrated Mystery Crew sprites [skip ci]"
          git push origin HEAD:feature/mystery-crew-v5-character-outfit-anchors-20261119
