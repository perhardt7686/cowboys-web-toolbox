name: Family avatar and arcade mobile acceptance
on:
  push:
    branches: [main]
    paths:
      - 'docs/community-readable.css'
      - 'docs/commons-games-polish.css'
      - 'docs/community.html'
      - 'docs/avatar-*'
      - 'docs/family-avatar-*'
      - 'docs/commons-retro-arcade.*'
      - 'docs/retro-arcade-engine.mjs'
      - 'docs/commons-arcade-shell.mjs'
      - 'docs/commons-arcade-titles.mjs'
      - 'docs/community.html'
      - 'docs/community.js'
      - 'docs/community-profiles.mjs'
      - 'tests/browser-avatar-rewards.py'
      - 'tests/browser-avatar-turntable.py'
      - 'tests/browser-avatar-cartoon.py'
      - 'tests/browser-family-avatar-studio.py'
      - 'tests/browser-pet-trading.py'
      - 'tests/browser-arcade-shell.py'
      - 'tests/browser-arcade-titles.py'
      - '.github/workflows/family-avatar-arcade-smoke.yml'
  pull_request:
    paths:
      - 'docs/community-readable.css'
      - 'docs/commons-games-polish.css'
      - 'docs/community.html'
      - 'docs/commons-retro-arcade.*'
      - 'docs/avatar-*'
      - 'docs/family-avatar-*'
      - 'docs/community-profiles.mjs'
      - 'tests/browser-avatar-*.py'
      - 'tests/browser-family-avatar-studio.py'
      - 'tests/browser-pet-trading.py'
      - '.github/workflows/family-avatar-arcade-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-member-preview:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Preinstalled official browser binaries avoid Chromium/WebKit apt download stalls.
      - name: Use matching preinstalled Playwright browser binaries
        run: python -m pip install 'playwright==1.64.1'
      - name: Verify avatar, pets, collectible artwork and arcade on phone
        run: |
          python -m http.server 8765 --directory docs >/tmp/family-arcade-http.log 2>&1 &
          status=0
          for test in avatar-turntable avatar-cartoon avatar-rewards avatar-pet-acting family-avatar-studio pet-trading arcade-shell arcade-titles; do
            echo "::group::${test}"
            python "tests/browser-${test}.py" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
      - name: Keep synthetic mobile acceptance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-avatar-arcade-mobile
          path: |
            reports/avatar-turntable-iphone.png
            reports/avatar-studio-desktop.png
            reports/avatar-cartoon-iphone.png
            reports/avatar-cartoon-interaction.webm
            reports/avatar-workshop-*.png
            reports/avatar-rewards-*.png
            reports/avatar-pet-original-acting-*.png
            reports/avatar-wardrobe-audit.png
            reports/avatar-face-silhouettes.png
            reports/family-avatar-studio-*.png
            reports/family-pet-trade-*.png
            reports/arcade-one-screen-iphone-sample.png
            reports/arcade-dash-title-tablet.png
          if-no-files-found: ignore
          retention-days: 7
