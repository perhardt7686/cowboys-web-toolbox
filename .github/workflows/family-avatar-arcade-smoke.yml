name: Family avatar and arcade mobile acceptance
on:
  push:
    branches: [main]
    paths:
      - 'docs/avatar-*'
      - 'docs/family-avatar-*'
      - 'docs/commons-retro-arcade.*'
      - 'docs/retro-arcade-engine.mjs'
      - 'docs/commons-arcade-shell.mjs'
      - 'docs/commons-arcade-titles.mjs'
      - 'docs/community.html'
      - 'docs/community.js'
      - 'docs/community-profiles.mjs'
      - 'tests/browser-avatar-rewards.py'
      - 'tests/browser-avatar-turntable.py'
      - 'tests/browser-avatar-cartoon.py'
      - 'tests/browser-family-avatar-studio.py'
      - 'tests/browser-pet-trading.py'
      - 'tests/browser-arcade-shell.py'
      - 'tests/browser-arcade-titles.py'
      - '.github/workflows/family-avatar-arcade-smoke.yml'
  pull_request:
    paths:
      - 'docs/avatar-*'
      - 'docs/family-avatar-*'
      - 'docs/community-profiles.mjs'
      - 'tests/browser-avatar-*.py'
      - 'tests/browser-family-avatar-studio.py'
      - 'tests/browser-pet-trading.py'
      - '.github/workflows/family-avatar-arcade-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-member-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Chromium and browser tests
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium webkit
      - name: Verify avatar, pets, collectible artwork and arcade on phone
        run: |
          python -m http.server 8765 --directory docs >/tmp/family-arcade-http.log 2>&1 &
          python tests/browser-avatar-turntable.py
          python tests/browser-avatar-cartoon.py
          python tests/browser-avatar-rewards.py
          python tests/browser-family-avatar-studio.py
          python tests/browser-pet-trading.py
          python tests/browser-arcade-shell.py
          python tests/browser-arcade-titles.py
      - name: Keep synthetic mobile acceptance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-avatar-arcade-mobile
          path: |
            reports/avatar-turntable-iphone.png
            reports/avatar-studio-desktop.png
            reports/avatar-cartoon-iphone.png
            reports/avatar-cartoon-interaction.webm
            reports/avatar-rewards-*.png
            reports/avatar-wardrobe-audit.png
            reports/family-avatar-studio-*.png
            reports/family-pet-trade-*.png
            reports/arcade-one-screen-iphone-sample.png
            reports/arcade-dash-title-tablet.png
          if-no-files-found: ignore
          retention-days: 7
