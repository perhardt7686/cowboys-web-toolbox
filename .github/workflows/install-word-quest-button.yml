name: Install Daily Word Quest Collapsible Button
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/install-word-quest-button.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Move Word Quest into matching collapsed button
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nimport base64,zlib\nexec(compile(zlib.decompress(base64.b64decode('')), 'install_word_quest_button_patch.py', 'exec'))\nPYCODE\nnode --check docs/commons-family.mjs\ngit diff --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add docs/commons-family.mjs docs/commons-family.css docs/community.html\nif ! git diff --cached --quiet; then\n  git commit -m 'Show Daily Word Quest as matching collapsed Commons game button'\n  git push origin HEAD:main\nfi"
