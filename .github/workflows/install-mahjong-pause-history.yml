name: Install Mahjong Pause, Remaining Pairs and Run History
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/install-mahjong-pause-history.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Install verified Mahjong changes
      shell: bash
      run: "python3 - <<'PY'\nimport base64,zlib\nexec(compile(zlib.decompress(base64.b64decode('')), 'mahjong_pause_history_patch.py', 'exec'))\nPY\nfor file in docs/commons-mahjong.mjs docs/commons-mahjong-profile.mjs docs/community.js docs/community-profiles.mjs; do\n  node --check \"$file\"\ndone\ngit diff --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add docs/commons-mahjong.mjs docs/commons-mahjong-profile.mjs docs/commons-mahjong.css docs/community.html docs/community.js docs/community-profiles.mjs\nif ! git diff --cached --quiet; then\n  git commit -m 'Save paused Mahjong games and show remaining matches and run history'\n  git push origin HEAD:main\nfi\n"
