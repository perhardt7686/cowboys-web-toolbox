name: Mystery Crew V10 Scout Wave prototype QA
on:
  pull_request:
    paths:
      - 'scripts/build_scout_v10_wave.py'
      - 'tests/mystery-crew-v10-art-audit.py'
      - 'tests/browser-mystery-crew-v10-frame06.py'
      - '.github/workflows/mystery-crew-v10-wave.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v10-local-preview-only:
    name: V10-frame-six-real-scene-source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare locked source-art and browser tooling
        run: |
          python -m pip install 'pillow>=11,<13' 'numpy>=2,<3' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Build V10 from committed V9 assets without replacing them
        run: python scripts/build_scout_v10_wave.py
      - name: Audit changed pixels and preserve original Scout identity
        run: python tests/mystery-crew-v10-art-audit.py
      - name: Install V10 sprites in ephemeral runner only
        run: |
          cp reports/scout-v10-frames/scout-v10-frame-01.png docs/mystery-crew-v9-scout/scout-v9-frame-01.png
          cp reports/scout-v10-frames/scout-v10-frame-02.png docs/mystery-crew-v9-scout/scout-v9-frame-02.png
          cp reports/scout-v10-frames/scout-v10-frame-03.png docs/mystery-crew-v9-scout/scout-v9-frame-03.png
          cp reports/scout-v10-frames/scout-v10-frame-04.png docs/mystery-crew-v9-scout/scout-v9-frame-04.png
          cp reports/scout-v10-frames/scout-v10-frame-05.png docs/mystery-crew-v9-scout/scout-v9-frame-05.png
          cp reports/scout-v10-frames/scout-v10-frame-06.png docs/mystery-crew-v9-scout/scout-v9-frame-06.png
          cp reports/scout-v10-frames/scout-v10-frame-07.png docs/mystery-crew-v9-scout/scout-v9-frame-07.png
          cp reports/scout-v10-frames/scout-v10-frame-08.png docs/mystery-crew-v9-scout/scout-v9-frame-08.png
      - name: Existing V9 game/source safety checks still pass with V10
        run: python tests/mystery-crew-v9-assets.py
      - name: Verify actual Creator scene, stage playback, fallback and accessibility
        run: |
          python -m http.server 8765 --directory docs >/tmp/scout-v10-ci.log 2>&1 &
          python tests/browser-mystery-crew-v9-scene.py
          python tests/browser-mystery-crew-v10-frame06.py
      - name: Preserve V10 source PNGs, QA and frame-six visual screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scout-v10-repaired-wave-visual-evidence
          path: |
            reports/scout-v10-frames/*.png
            reports/scout-v10-metrics.json
            reports/mystery-crew-v9-wave-scene-*.png
            reports/scout-v10-real-scene-frame06-*.png
            reports/scout-v10-stage-frame06-*.png
          retention-days: 10
          if-no-files-found: warn
