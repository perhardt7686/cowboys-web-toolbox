name: Edward AI test moderator preview and fair play
on:
  pull_request:
    paths:
      - 'docs/edward-test-persona.mjs'
      - 'docs/community.js'
      - 'docs/community.html'
      - 'docs/community-powers.mjs'
      - 'docs/EDWARD-TEST-MODERATOR.md'
      - 'tests/edward-test-persona.test.mjs'
      - 'tests/browser-edward-test-moderator.py'
      - '.github/workflows/edward-ai-test-moderator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Edward-preview:
    name: Edward-preview-isolation-and-legal-72-tile-game
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check syntax and fair-play legal moves
        run: |
          node --check docs/edward-test-persona.mjs
          node --check docs/community.js
          node --check docs/community-powers.mjs
          node --test tests/edward-test-persona.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Chromium for local preview only
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Verify no login or permission leak and capture mobile previews
        run: |
          python -m http.server 8765 --directory docs >/tmp/edward-preview-server.log 2>&1 &
          python tests/browser-edward-test-moderator.py
      - name: Upload sample account screenshots, never member credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edward-ai-test-moderator-local-preview
          path: reports/edward-ai-test-moderator-*.png
          if-no-files-found: ignore
          retention-days: 7
