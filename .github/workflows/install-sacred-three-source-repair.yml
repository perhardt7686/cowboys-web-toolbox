name: Safeguard Sacred Three Toolbox Release Source
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/install-sacred-three-source-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install durable homepage source and offline preview improvements
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nimport base64,zlib\nexec(compile(zlib.decompress(base64.b64decode('')), 'sacred_three_source_repair.py', 'exec'))\nPYCODE\ngit diff --check\nnode --check docs/app.js\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add index.template.html build.py docs/index.html docs/Cowboys-Web-Toolbox-Preview.html\nif ! git diff --cached --quiet; then\n  git commit -m 'Keep Commons-inspired Toolbox redesign in source builds and offline preview'\n  git push origin HEAD:main\nfi\n"
