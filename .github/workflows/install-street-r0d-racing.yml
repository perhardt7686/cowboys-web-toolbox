          html_file=Path('docs/community.html')
          html=html_file.read_text(encoding='utf-8')
          assert '</head>' in html and 'commons-mahjong.mjs' in html and 'commons-letter-lock.mjs' in html, 'Original Commons template changed; refusing partial installation'
          html=re.sub(r'<link rel="stylesheet" href="commons-streetrod.css\?v=[^"<>]+">\s*','',html)
          html=re.sub(r'<script type="module" src="commons-streetrod.mjs\?v=[^"<>]+"></script>\s*','',html)
          insert='<link rel="stylesheet" href="commons-streetrod.css?v=rod1">\n<script type="module" src="commons-streetrod.mjs?v=rod1"></script>\n'
          html=html.replace('</head>',insert+'</head>',1)
          html_file.write_text(html,encoding='utf-8')
          assert html.count('commons-streetrod.mjs?v=rod1')==1
          assert html.count('commons-streetrod.css?v=rod1')==1
          js=Path('docs/commons-streetrod.mjs').read_text(encoding='utf-8')
          css=Path('docs/commons-streetrod.css').read_text(encoding='utf-8')
          assert all(label in js for label in ['Street r0d Racing','community_streetrod_state','community_streetrod_start','community_streetrod_finish','community_streetrod_buy','community_streetrod_select','community_streetrod_abandon','sr-arcade-mode-pill'])
          assert '#sr-inside[hidden]{display:none!important}' in css
          print('Installed: Street r0d Racing garage, solo, shared member duels, personal/global scores, awards, passport, mobile collapse.')
          PYCODE
      - name: Syntax validation and regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/commons-streetrod.mjs
          node --check docs/commons-mahjong.mjs
          node --check docs/commons-letter-lock.mjs
          python3 - <<'PYCODE'
          from pathlib import Path
          html=Path('docs/community.html').read_text()
          js=Path('docs/commons-streetrod.mjs').read_text()
          assert html.count('commons-streetrod.mjs?v=rod1')==1
          assert html.count('commons-streetrod.css?v=rod1')==1
          assert 'Street r0d Racing' in js and 'community_streetrod_finish' in js
          assert 'data-sr-action="join"' in js and 'data-sr-action="solo"' in js
          assert 'id="sr-toggle"' in js and 'aria-expanded="false"' in js
          print('Game modules and arcade entrypoint validated.')
          PYCODE
          git diff --check
          npm ci
          npm test --if-present
      - name: Commit Street r0d Racing release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community.html docs/commons-streetrod.mjs docs/commons-streetrod.css supabase/migrations/20261112235959_community_streetrod_racing.sql
          if ! git diff --cached --quiet; then
            git commit -m "Add Street r0d Racing solo garage racer and multiplayer challenges"
            git push origin HEAD:main
          fi
