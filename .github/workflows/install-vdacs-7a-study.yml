      - name: Verify JavaScript and changes
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/commons-vdacs-study.mjs
          git diff --check
          npm ci
          npm test --if-present
      - name: Commit flashcards and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commons-vdacs-study.mjs docs/commons-vdacs-study.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m "Add original official-source 7A exam study cards to Toolbox"
            git push origin HEAD:main
          fi
