name: Install Mahjong Mystery Road 1000-Level Campaign
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/install-mahjong-mystery-road.yml
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Install 1000 levels, profile awards and mobile HUD
      shell: bash
      run: "python3 - <<'PYCODE'\nimport base64,zlib\nexec(compile(zlib.decompress(base64.b64decode('')).decode('utf-8'),'mahjong_campaign_patch.py','exec'))\n\
        PYCODE\nnode --check docs/commons-mahjong.mjs\nnode --check docs/commons-mahjong-profile.mjs\nnode --check docs/community-profiles.mjs\n\
        node --check docs/community.js\ngit diff --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add docs/commons-mahjong.mjs docs/commons-mahjong-profile.mjs docs/commons-mahjong.css docs/community-profiles.mjs docs/community.js\
        \ docs/community.html\nif ! git diff --cached --quiet; then\n git commit -m 'Add Mahjong Mystery Road 1000-level campaign'\n git push\
        \ origin HEAD:main\nfi\n"
