      - name: Validate sources and existing release tests
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/commons-shared-guesses.mjs
          git diff --check
          npm ci
          npm test --if-present
      - name: Commit shared word ledger to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commons-shared-guesses.mjs docs/commons-shared-guesses.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m "Show every team word guess and browsable history; preserve dictionary validation"
            git push origin HEAD:main
          fi
