name: Install Ana and Cowboy Plate Game
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-plate-game.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add two-person plate game to Commons
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from base64 import b64decode
          from gzip import decompress
          assets = {
            'commons-plates.css': '',
            'commons-plates.mjs': '',
          }
          target=Path('docs')
          for filename,payload in assets.items():
              (target/filename).write_bytes(decompress(b64decode(payload)))
          page=target/'community.html'
          html=page.read_text(encoding='utf-8')
          anchor='<link rel="stylesheet" href="commons-family.css?v=1">'
          assert anchor in html,'Missing known Commons anchor; change aborted'
          addition='<link rel="stylesheet" href="commons-plates.css?v=1"><script type="module" src="commons-plates.mjs?v=1"></script>'
          if addition not in html:
              html=html.replace(anchor,addition+'\n'+anchor,1)
              page.write_text(html,encoding='utf-8')
          PYCODE
          node --check docs/commons-plates.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community.html docs/commons-plates.mjs docs/commons-plates.css
          git diff --cached --quiet || (git commit -m "Install Ana and Cowboy private license plate game" && git push origin HEAD:main)
