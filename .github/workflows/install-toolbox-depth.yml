name: Upgrade Cowboy Toolbox Visual Depth and Clarity
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/install-toolbox-depth.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Apply scoped design and verify site
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nimport zlib,base64\nexec(compile(zlib.decompress(base64.b64decode('')), 'install_toolbox_depth_patch.py', 'exec'))\nPYCODE\npython3 - <<'PYTEST'\nfrom pathlib import Path\nhtml=Path('docs/index.html').read_text()\nassert 'toolbox-mark.webp' in html\nassert html.count('toolbox-depth.css?v=depth7')==1\nassert html.count('class=\"toolbox-map-card')==3\nassert '<script type=\"application/json\" id=\"catalog-data\">' in html\nassert Path('docs/toolbox-depth.css').stat().st_size>10000\nprint('Design, route links, logo and catalog presence verified.')\nPYTEST\ngit diff --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add docs/index.html docs/toolbox-depth.css\nif ! git diff --cached --quiet; then\n  git commit -m 'Refresh Toolbox design with Commons-inspired depth and contrast'\n  git push origin HEAD:main\nfi"
