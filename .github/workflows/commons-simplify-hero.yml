name: Remove Commons Shortcut Cards And Improve Readability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commons-simplify-hero.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Simplify Commons intro and improve contrast
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          css=Path('docs/community-readable.css')
          page=Path('docs/community.html')
          assert css.is_file() and page.is_file(), 'Expected Commons files are missing'
          original=css.read_text(encoding='utf-8')
          marker='/* Commons intro: remove four shortcut cards and improve contrast */'
          import base64,zlib
          patch=zlib.decompress(base64.b64decode('')).decode("utf-8")
          assert '.lab-intro' in original or marker in original, 'Unexpected Commons stylesheet; no changes made'
          if marker not in original:
              css.write_text(original.rstrip()+'\n'+patch, encoding='utf-8')
          html=page.read_text(encoding='utf-8')
          old='community-readable.css?v=readability1'
          new='community-readable.css?v=readability2'
          assert html.count(old)==1 or html.count(new)==1, 'Expected stylesheet reference missing; no changes made'
          if old in html:
              page.write_text(html.replace(old,new,1),encoding='utf-8')
          PYCODE
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/community-readable.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Commons intro cards and improve readability'
            git push origin HEAD:main
          fi
