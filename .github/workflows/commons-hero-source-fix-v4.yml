name: Remove Commons Shortcut Cards At Source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/commons-hero-source-fix-v4.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove four cards and force accessible text colors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lab=Path('docs/community-lab.mjs')
          app=Path('docs/community.js')
          page=Path('docs/community.html')
          for p in (lab,app,page): assert p.is_file(),f'Missing {p}'
          s=lab.read_text()
          tag='<div class="lab-quick-actions">'
          if tag in s:
              assert s.count(tag)==1
              a=s.index(tag);b=s.find('</div>`;',a)
              assert b>a and 'Show your work' in s[a:b], 'Source changed, no edits made'
              s=s[:a]+s[b+6:]
          for before,after in [
            ('<h2>Bring a task.','<h2 style="color:#332047!important;text-shadow:none!important;font-family:Georgia,serif!important;">Bring a task.'),
            ('<em>Leave with a way forward.</em>','<em style="color:#07535d!important;text-shadow:none!important;">Leave with a way forward.</em>'),
            ('<p>Ask for a tool, pass along a discovery, or show us what you made.</p>','<p style="color:#3b3040!important;font-weight:650!important;">Ask for a tool, pass along a discovery, or show us what you made.</p>')]:
              assert s.count(before)==1 or s.count(after)==1, 'Unexpected intro markup'
              if before in s: s=s.replace(before,after,1)
          assert tag not in s
          lab.write_text(s)
          j=app.read_text()
          old='./community-lab.mjs?v=private1';new='./community-lab.mjs?v=hero4'
          assert j.count(old)==1 or j.count(new)==1
          app.write_text(j.replace(old,new,1))
          h=page.read_text()
          for old,new in [('community.js?v=private1','community.js?v=hero4'),('community-readable.css?v=readability3','community-readable.css?v=readability4')]:
              assert h.count(old)==1 or h.count(new)==1, 'Unexpected page reference'
              h=h.replace(old,new,1)
          page.write_text(h)
          PY
          node --check docs/community-lab.mjs
          node --check docs/community.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/community-lab.mjs docs/community.js docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Commons intro shortcuts at source, fix contrast'
            git push origin HEAD:main
          fi
