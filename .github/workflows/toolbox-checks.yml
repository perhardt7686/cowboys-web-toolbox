name: Toolbox release and weekly review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 build.py
      - run: npm test
      - run: npm run check:edge
      - run: node docs/check-release.cjs
      - name: Bounded link review
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 docs/check-links.py --limit 32 --output reports/link-health.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: toolbox-link-review
          path: reports/link-health.json
          retention-days: 30
