name: Mystery Crew Scout V9 in-scene prototype acceptance
on:
  pull_request:
    paths:
      - 'docs/mystery-crew-v9-scout/**'
      - 'docs/mystery-crew-v9-scout-lab.mjs'
      - 'docs/mystery-crew-creator.mjs'
      - 'tests/browser-mystery-crew-v9-scene.py'
      - 'tests/mystery-crew-v9-assets.py'
      - 'tests/mystery-crew-v9-stage.test.mjs'
      - '.github/workflows/mystery-crew-v9-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout-v9-preview:
    name: V9-original-paint-in-real-scene-four-viewport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check preview-only module and family account isolation
        run: |
          node --check docs/mystery-crew-v9-scout-lab.mjs
          node --check docs/mystery-crew-creator.mjs
          node --test tests/mystery-crew-v9-stage.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original painting and browser verification tools
        run: |
          python -m pip install 'pillow>=11,<13' 'numpy>=2,<3' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Validate source exactness and eight frame pack
        run: python tests/mystery-crew-v9-assets.py
      - name: Play and inspect V9 Scout in real Creator scene
        run: |
          mkdir -p reports
          python -m http.server 8765 --directory docs >/tmp/scout-v9-scene-server.log 2>&1 &
          python tests/browser-mystery-crew-v9-scene.py
      - name: Upload scene screenshots for human visual acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystery-crew-scout-v9-in-scene-screenshots
          path: reports/mystery-crew-v9-wave-scene-*.png
          retention-days: 10
          if-no-files-found: ignore
