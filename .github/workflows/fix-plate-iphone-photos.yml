name: Fix iPhone plate game photo uploads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-plate-iphone-photos.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib,base64
          p=Path('docs/commons-plates.mjs');s=p.read_text()
          a=s.index(' async function compress(file){');b=s.index(' async function post(ev){',a)
          f=zlib.decompress(base64.b64decode('')).decode()
          s=s[:a]+f+s[b:]
          x='const blob=await compress(file);path=`${userId}/${crypto.randomUUID()}.webp`;'
          y='const blob=await compress(file);path=`${userId}/${crypto.randomUUID()}.jpg`;setStatus(`Uploading resized JPEG (${Math.round(blob.size/1024)} KB)…`);'
          assert s.count(x)==1;s=s.replace(x,y,1)
          x=".upload(path,blob,{contentType:'image/webp',upsert:false})"
          y=".upload(path,blob,{contentType:'image/jpeg',upsert:false})"
          assert s.count(x)==1;s=s.replace(x,y,1)
          x="$('plate-new').addEventListener('submit',post);"
          y=x+"$('plate-submit').before($('plate-status'));$('plate-photo').addEventListener('change',()=>{const f=$('plate-photo').files?.[0];if(f)setStatus(`Photo selected (${(f.size/1048576).toFixed(1)} MB). Add the guess and tap Post challenge.`);});"
          assert s.count(x)==1;s=s.replace(x,y,1)
          p.write_text(s)
          PY
      - run: |
          node --check docs/commons-plates.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commons-plates.mjs
          git diff --cached --quiet || (git commit -m "Fix iPhone license plate photo uploads" && git push origin HEAD:main)
