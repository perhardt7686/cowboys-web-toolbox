name: Mystery Crew Creator visual and interaction acceptance
on:
  pull_request:
    paths:
      - 'docs/mystery-crew-*'
      - 'docs/community-profiles.mjs'
      - 'docs/community.html'
      - 'supabase/migrations/20261119000712_mystery_crew_creator_accounts.sql'
      - 'tests/mystery-crew-creator.test.mjs'
      - 'tests/mystery-crew-art.test.mjs'
      - 'tests/mystery-painterly.test.mjs'
      - 'docs/mystery-painterly-*'
      - 'docs/mystery-workshop-v4.svg'
      - 'docs/mystery-workshop-v4.webp'
      - 'docs/mystery-van-v4.svg'
      - 'tests/mystery-scene-v4.test.mjs'
      - 'tests/mystery-crew-v5.test.mjs'
      - 'tests/mystery-crew-v6-motion.test.mjs'
      - 'scripts/build_mystery_crew_v5.py'
      - '.github/workflows/mystery-crew-v5-assets.yml'
      - 'supabase/migrations/20261119023000_mystery_crew_fidelity_traits.sql'
      - 'tests/browser-mystery-crew-creator.py'
      - '.github/workflows/mystery-crew-creator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mystery-crew:
    name: new-creator-mobile-and-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify creator module and reference contract
        run: |
          node --check docs/mystery-crew-creator.mjs
          node --check docs/mystery-crew-art.mjs
          node --check docs/mystery-crew-stage-art.mjs
          node --check docs/mystery-painterly-stage.mjs
          node --check docs/mystery-crew-scene-v4.mjs
          node --check docs/mystery-crew-character-v5.mjs
          node --check docs/mystery-crew-motion-v6.mjs
          node --check docs/mystery-crew-portrait.mjs
          node --check docs/community-profiles.mjs
          node --test tests/mystery-crew-creator.test.mjs tests/mystery-crew-art.test.mjs tests/mystery-painterly.test.mjs tests/mystery-scene-v4.test.mjs tests/mystery-crew-v5.test.mjs tests/mystery-crew-v6-motion.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Chromium acceptance runner
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Interact with actual creator on iPhones and desktop
        run: |
          python -m http.server 8765 --directory docs >/tmp/mystery-crew-server.log 2>&1 &
          python tests/browser-mystery-crew-creator.py
      - name: Upload creator screenshots for reference comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystery-crew-creator-screens
          path: reports/mystery-crew-*.png
          retention-days: 10
          if-no-files-found: ignore
