          for path, chunks in payloads.items():
              target=Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(zlib.decompress(base64.b64decode(''.join(chunks))))
          html_path=Path('docs/community.html')
          html=html_path.read_text(encoding='utf-8')
          assert '</head>' in html and 'commons-family.mjs' in html and 'commons-family.css' in html, 'Unexpected Commons template; no page edit'
          html=re.sub(r'<link rel="stylesheet" href="commons-drawing-toggle.css\?v=[^"<>]+">\s*', '', html)
          html=re.sub(r'<script type="module" src="commons-drawing-toggle.mjs\?v=[^"<>]+"></script>\s*', '', html)
          version='studio2'
          tags='<link rel="stylesheet" href="commons-drawing-toggle.css?v='+version+'">\n' + '<script type="module" src="commons-drawing-toggle.mjs?v='+version+'"></script>\n'
          html=html.replace('</head>',tags+'</head>',1)
          html_path.write_text(html,encoding='utf-8')
          assert html.count('commons-drawing-toggle.mjs?v=studio2')==1
          assert html.count('commons-drawing-toggle.css?v=studio2')==1
          js=Path('docs/commons-drawing-toggle.mjs').read_text(encoding='utf-8')
          assert 'content.append(stage)' in js and 'content.hidden = !open' in js
          assert 'boundZone = null' in js and 'existing?.remove()' in js
          assert 'startDrawingStudio(' not in js, 'Must not reinitialize existing canvas'
          print('Drawing Studio game button installed; existing canvas remains intact.')
          PYCODE
      - name: Validate unchanged drawing engine and run repository tests
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/commons-drawing-toggle.mjs
          node --check docs/commons-drawing.mjs
          node --check docs/commons-family.mjs
          git diff --check
          npm ci
          npm test --if-present
      - name: Commit Drawing Studio collapsible button
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commons-drawing-toggle.mjs docs/commons-drawing-toggle.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m "Wrap existing Drawing Studio in persistent collapsible game button"
            git push origin HEAD:main
          fi
