name: Repair Collapsible Drawing Studio Game Button
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/install-drawing-studio-toggle-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commons-drawing-toggle-v2-installer
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install isolated, reversible drawing-studio wrapper
