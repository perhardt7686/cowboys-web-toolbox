name: Mahjong 5000 Garden Road acceptance
on:
  pull_request:
    paths:
      - 'docs/mahjong-nature-road.*'
      - 'docs/commons-mahjong.mjs'
      - 'docs/commons-mahjong-profile.mjs'
      - 'docs/community.html'
      - 'supabase/migrations/*mahjong_mystery_road_5000.sql'
      - 'tests/mahjong-nature-road.test.mjs'
      - 'tests/browser-mahjong-nature-road.py'
      - '.github/workflows/mahjong-nature-road-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'docs/mahjong-nature-road.*'
      - 'docs/commons-mahjong.mjs'
      - 'docs/commons-mahjong-profile.mjs'
      - 'docs/community.html'
      - 'supabase/migrations/*mahjong_mystery_road_5000.sql'
      - 'tests/mahjong-nature-road.test.mjs'
      - 'tests/browser-mahjong-nature-road.py'
      - '.github/workflows/mahjong-nature-road-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          npm ci
          node --check docs/mahjong-nature-road.mjs
          node --check docs/commons-mahjong.mjs
          npm test
  mobile-garden-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Test 5000-stage garden map on 375/390/430/768 px devices
        run: |
          python -m http.server 8765 --directory docs >/tmp/nature-road-http.log 2>&1 &
          python tests/browser-mahjong-nature-road.py
      - name: Preserve visual comparison screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mahjong-garden-map-mobile
          path: reports/mahjong-nature-road-*.png
          if-no-files-found: ignore
          retention-days: 7
