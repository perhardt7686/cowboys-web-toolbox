          module='<script type="module" src="commons-letter-lock.mjs?v=arcade1"></script>' 
          if style not in src or module not in src:
              import re
              src=re.sub(r'<link rel="stylesheet" href="commons-letter-lock.css\?v=[^"]+">','',src)
              src=re.sub(r'<script type="module" src="commons-letter-lock.mjs\?v=[^"]+"></script>','',src)
              src=src.replace('</head>',style+module+'\n</head>',1)
              html.write_text(src,encoding='utf-8')
          assert style in html.read_text(encoding='utf-8') and module in html.read_text(encoding='utf-8')
          assert 'community_wordle_submit' in Path('docs/commons-letter-lock.mjs').read_text(encoding='utf-8')
          PYCODE
      - name: Validate game source and repository tests
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/commons-letter-lock.mjs
          git diff --check
          npm ci
          npm test --if-present
      - name: Commit new game to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commons-letter-lock.mjs docs/commons-letter-lock.css docs/community.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Daily Letter Lock, Arcade Passport levels and achievements"
            git push origin HEAD:main
          fi
