name: V8 member studio original-art acceptance
on:
  pull_request:
    paths:
      - 'docs/avatar-v8-live.*'
      - 'docs/avatar-v8-original-cels.mjs'
      - 'docs/avatar-v8-prize-cels.mjs'
      - 'docs/avatar-studio-preview.mjs'
      - 'docs/avatar-studio-pets.mjs'
      - 'docs/avatar-reward-studio.mjs'
      - 'docs/community.html'
      - 'tests/avatar-v8-member.test.mjs'
      - 'tests/browser-avatar-v8-member.py'
      - 'tests/browser-avatar-rewards.py'
      - 'tests/browser-avatar-turntable.py'
      - '.github/workflows/avatar-v8-member.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v8-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify syntax and data-preserving V8 art contracts
        run: |
          for f in docs/avatar-v8-live.mjs docs/avatar-v8-original-cels.mjs docs/avatar-v8-prize-cels.mjs docs/avatar-studio-preview.mjs docs/avatar-studio-pets.mjs docs/avatar-reward-studio.mjs; do node --check "$f"; done
          node --test tests/avatar-v8-member.test.mjs tests/avatar-v8-pilot.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install real Chromium acceptance engine
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Test actual member art, rewards, pets and save flow
        run: |
          python -m http.server 8765 --directory docs >/tmp/v8-member-http.log 2>&1 &
          python tests/browser-avatar-v8-member.py
          python tests/browser-avatar-rewards.py
          python tests/browser-avatar-turntable.py
          python tests/browser-family-avatar-studio.py
      - name: Preserve actor, pet and collection screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avatar-v8-member-live-art
          path: reports/v8-live-*.png
          retention-days: 7
          if-no-files-found: ignore
