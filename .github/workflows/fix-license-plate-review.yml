name: Fix License Plate Photo Preview and Review Zoom
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/fix-license-plate-review.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Fix stored plate photo loading and review
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nimport base64,zlib\nexec(compile(zlib.decompress(base64.b64decode('')),'fix_license_plate_photo_review_patch.py','exec'))\nPYCODE\nnode --check docs/commons-plates.mjs\ngit diff --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add docs/commons-plates.mjs docs/commons-plates.css docs/community.html\nif ! git diff --cached --quiet; then\n git commit -m 'Restore License Plate photo review and add full-size viewer and retry'\n git push origin HEAD:main\nfi\n"
