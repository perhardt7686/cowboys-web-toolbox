name: Family Fun last-play and Reading Comfort acceptance
on:
  pull_request:
    paths:
      - 'docs/commons-family-fun.mjs'
      - 'docs/family-arcade-activity.mjs'
      - 'docs/family-marquee-neon.css'
      - 'docs/family-board.mjs'
      - 'docs/community-board-accessibility.mjs'
      - 'docs/community-readable.css'
      - 'docs/community.html'
      - 'docs/community.js'
      - 'docs/commons-arcade-shell.mjs'
      - 'supabase/migrations/*family_arcade_recent_activity.sql'
      - 'tests/family-arcade-recent-activity.test.mjs'
      - 'tests/browser-family-fun-recent.py'
      - '.github/workflows/family-fun-recent-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commons-family-fun.mjs'
      - 'docs/family-arcade-activity.mjs'
      - 'docs/community-board-accessibility.mjs'
      - 'docs/community-readable.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          npm ci
          node --check docs/family-arcade-activity.mjs
          node --check docs/community-board-accessibility.mjs
          node --check docs/commons-family-fun.mjs
          npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Test recent-first marquee and reading dropdown on 375/430/768px
        run: |
          python -m http.server 8765 --directory docs >/tmp/family-marquee-http.log 2>&1 &
          python tests/browser-family-fun-recent.py
      - name: Preserve visual previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-recent-reading-mobile
          path: reports/*-*.png
          if-no-files-found: ignore
          retention-days: 7
