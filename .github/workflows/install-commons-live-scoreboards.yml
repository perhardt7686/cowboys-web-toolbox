name: Install Live Score Ribbons for Commons Games
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/install-commons-live-scoreboards.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - name: Add live record and personal score ribbons to all Commons games
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nimport base64,zlib\nexec(compile(zlib.decompress(base64.b64decode('')), 'install_scoreboards.py', 'exec'))\nPYCODE\nfor file in docs/commons-plates.mjs docs/commons-mahjong.mjs docs/commons-family.mjs; do node --check \"$file\"; done\ngrep -q 'commons-scoreboard.css?v=score5' docs/community.html\ngrep -q 'plate-ribbon-lead' docs/commons-plates.mjs\ngrep -q 'mahjong-ribbon-record' docs/commons-mahjong.mjs\ngrep -q 'word-ribbon-record' docs/commons-family.mjs\ngit diff --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add docs/commons-scoreboard.css docs/community.html docs/commons-plates.mjs docs/commons-mahjong.mjs docs/commons-family.mjs\nif ! git diff --cached --quiet; then\n  git commit -m 'Show running records and personal bests across Commons games'\n  git push origin HEAD:main\nfi"
